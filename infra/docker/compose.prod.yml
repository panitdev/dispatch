services:
  dispatch:
    image: ${IMAGE_NAMESPACE:?IMAGE_NAMESPACE is required}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-dispatch}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-dispatch}
      API_PORT: "3000"
      FRONTEND_DIST_DIR: /app/dist
      RUST_LOG: ${RUST_LOG:-info}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?FRONTEND_ORIGIN is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      KRATOS_PUBLIC_URL: ${KRATOS_PUBLIC_URL:?KRATOS_PUBLIC_URL is required}
      KRATOS_BROWSER_URL: ${KRATOS_BROWSER_URL:?KRATOS_BROWSER_URL is required}
      DISPATCH_API_URL: ${DISPATCH_API_URL:-}
      DISPATCH_PUBLIC_URL: ${DISPATCH_PUBLIC_URL:?DISPATCH_PUBLIC_URL is required}
      HYDRA_PUBLIC_URL: ${HYDRA_PUBLIC_URL:?HYDRA_PUBLIC_URL is required}
      HYDRA_ADMIN_URL: ${HYDRA_ADMIN_URL:?HYDRA_ADMIN_URL is required}
      SNOWFLAKE_MACHINE_ID: ${SNOWFLAKE_MACHINE_ID:-1}
      SNOWFLAKE_NODE_ID: ${SNOWFLAKE_NODE_ID:-1}
    env_file:
      - path: /opt/dispatch/env/dispatch.env
        required: false
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.routers.dispatch.rule=Host(`${DISPATCH_HOST:?DISPATCH_HOST is required}`)
      - traefik.http.routers.dispatch.entrypoints=websecure
      - traefik.http.routers.dispatch.tls=true
      - traefik.http.routers.dispatch.tls.certresolver=letsencrypt
      - traefik.http.routers.dispatch.service=dispatch
      - traefik.http.services.dispatch.loadbalancer.server.port=3000
    expose:
      - "3000"
    networks:
      - dispatch
      - traefik
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dispatch}
      POSTGRES_USER: ${POSTGRES_USER:-dispatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
    volumes:
      - postgres-data:/var/lib/postgresql/data
    expose:
      - "5432"
    networks:
      - dispatch
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  dispatch:
    name: dispatch
    driver: bridge
  traefik:
    name: traefik
    external: true

volumes:
  postgres-data:
